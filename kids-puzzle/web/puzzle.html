<title>Puzzle Time</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

/* Layout concept: a sky-blue table with a white board and a deeper-blue tray; big round buttons, almost no text. */
:root {
  --table: #bfe3f6;
  --table-hi: #e3f4fc;
  --table-lo: #9fd0ea;
  --board: #ffffff;
  --tray: #a3d0e9;
  --tray-edge: rgba(32, 84, 122, 0.2);
  --sun: #ffc933;
  --sun-deep: #f5a200;
  --mint: #6fd3b0;
  --coral: #ef6a5b;
  --ink: #27506f;
  --ink-soft: rgba(39, 80, 111, 0.5);
  --glass: rgba(255, 255, 255, 0.86);
  --scrim: rgba(28, 62, 90, 0.82);
  --shadow: 0 6px 18px rgba(33, 86, 124, 0.24);
  --shadow-sm: 0 3px 8px rgba(33, 86, 124, 0.22);
  --font: "Fredoka", "SF Pro Rounded", ui-rounded, "Nunito", system-ui, sans-serif;
}

html { box-sizing: border-box; height: 100%; overflow: hidden; background: var(--table); }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(120% 90% at 15% 0%, var(--table-hi) 0%, var(--table) 55%, var(--table-lo) 140%), var(--table);
  background-color: var(--table);
  color: var(--ink);
  font-family: var(--font);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
svg { display: block; }

#app { --d: 60px; height: 100%; width: 100%; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#app.small { --d: 44px; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; animation: screenIn 0.25s ease-out; }
@keyframes screenIn { from { opacity: 0; } to { opacity: 1; } }

/* Round icon buttons */
.rbtn {
  display: grid;
  place-items: center;
  width: var(--d);
  height: var(--d);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--glass);
  color: var(--ink);
  box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(39, 80, 111, 0.06);
  cursor: pointer;
  transition: transform 0.12s ease-out, opacity 0.2s;
}
.rbtn svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.rbtn:active { transform: scale(0.92); }
.rbtn:focus-visible, .sz:focus-visible, .card button:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 3px; }
.rbtn.go { background: var(--sun); color: var(--ink); }
.rbtn.go[disabled] { opacity: 0.45; pointer-events: none; }
.rbtn.danger { background: var(--coral); color: #fff; }

/* ---------- Shelf ---------- */
#shelf .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 84px 20px 36px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 16px; max-width: 1240px; margin: 0 auto; }
@media (min-width: 700px) {
  #shelf .scroll { padding: 96px 32px 40px; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
}
.card { position: relative; aspect-ratio: 3 / 2; border-radius: 26px; box-shadow: var(--shadow); background: var(--board); animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
@keyframes pop { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card .open { position: absolute; inset: 0; width: 100%; padding: 0; border: 5px solid var(--board); border-radius: inherit; overflow: hidden; background: var(--board); cursor: pointer; transition: transform 0.12s ease-out; }
.card .open:active { transform: scale(0.97); }
.card .open img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 20px; pointer-events: none; }
.badge { position: absolute; right: 12px; bottom: 12px; width: 52px; height: 52px; border-radius: 50%; background: var(--board); box-shadow: var(--shadow-sm); display: grid; place-items: center; pointer-events: none; }
.badge svg { width: 52px; height: 52px; }
.badge.star { background: var(--sun); }
.badge.star svg { width: 30px; height: 30px; fill: var(--board); stroke: var(--sun-deep); stroke-width: 1.6; stroke-linejoin: round; }
.ring-track { fill: none; stroke: rgba(39, 80, 111, 0.14); stroke-width: 6; }
.ring-val { fill: none; stroke: var(--sun-deep); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 26px 26px; }
.card.add .open { border: 4px dashed var(--ink-soft); background: rgba(255, 255, 255, 0.45); display: grid; place-items: center; color: var(--ink); box-shadow: none; }
.card.add { box-shadow: none; background: transparent; }
.card.add svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.card .del { position: absolute; top: -10px; right: -10px; z-index: 2; width: 44px; height: 44px; animation: pop 0.3s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.card .confirm { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-radius: inherit; background: var(--scrim); color: #fff; font-weight: 600; font-size: 20px; }
.card.asking .confirm { display: flex; }
.confirm .row { display: flex; gap: 16px; }
.confirm .rbtn { --d: 52px; }

#lock { position: absolute; top: calc(14px); right: 16px; z-index: 5; --d: 52px; opacity: 0.8; touch-action: none; }
#lock .ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; }
#lock .ring svg { width: 100%; height: 100%; stroke-width: 0; fill: none; }
#lock .ring circle { fill: none; stroke: var(--sun-deep); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
#parent-ok { position: absolute; top: 14px; right: 16px; z-index: 5; --d: 56px; }

/* ---------- New puzzle ---------- */
#newp { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#np-close { position: absolute; top: 14px; left: 16px; z-index: 5; }
#np-ok { position: absolute; top: 14px; right: 16px; z-index: 5; }
.np-frame { position: relative; width: 600px; height: 400px; border-radius: 22px; overflow: hidden; background: var(--board); box-shadow: var(--shadow); touch-action: none; cursor: grab; }
.np-frame canvas { position: absolute; left: 0; top: 0; display: block; pointer-events: none; transform-origin: 0 0; }
.np-pick { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; background: rgba(255, 255, 255, 0.55); border: 4px dashed var(--ink-soft); border-radius: 22px; color: var(--ink); }
.np-pick svg { width: 72px; height: 72px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.np-swap { position: absolute; left: 12px; bottom: 12px; --d: 48px; }
.np-swap svg { width: 55%; height: 55%; }
.np-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.sizes { display: flex; gap: 12px; align-items: stretch; justify-content: center; }
.sz { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 88px; padding: 10px 12px; border: 0; border-radius: 20px; background: var(--glass); box-shadow: var(--shadow-sm); cursor: pointer; font-weight: 600; font-size: 22px; line-height: 1; transition: transform 0.12s ease-out, background 0.15s; }
.sz:active { transform: scale(0.95); }
.sz svg { width: 52px; height: 35px; }
.sz svg rect { fill: var(--board); stroke: var(--ink); stroke-width: 1.6; }
.sz svg path { stroke: var(--ink-soft); stroke-width: 1; fill: none; }
.sz.sel { background: var(--sun); box-shadow: var(--shadow-sm), 0 0 0 3px var(--board); }
.sz.sel svg path { stroke: var(--ink); }
.sz small { font-size: 12px; font-weight: 500; opacity: 0.8; letter-spacing: 0.02em; }
.sz.try { min-width: 74px; font-size: 18px; background: rgba(255, 255, 255, 0.55); }
.sz.try.sel { background: var(--sun); }
#app.small .sz { min-width: 66px; padding: 6px 8px; font-size: 18px; border-radius: 16px; }
#app.small .sz svg { width: 40px; height: 27px; }
#app.small .sizes { gap: 8px; }

/* ---------- Puzzle ---------- */
#puzzle { touch-action: none; }
#p-board { position: absolute; border-radius: 14px; background: var(--board); box-shadow: 0 8px 24px rgba(33, 86, 124, 0.25), inset 0 0 0 1px rgba(39, 80, 111, 0.08); overflow: hidden; }
#p-ghost { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.25; transition: opacity 0.3s; pointer-events: none; }
#p-tray { position: absolute; border-radius: 28px; background: var(--tray); box-shadow: inset 0 3px 8px var(--tray-edge), inset 0 0 0 1px var(--tray-edge); }
#app.small #p-tray { border-radius: 18px; }
#app.small #p-board { border-radius: 8px; }
#p-bar { position: absolute; border-radius: 99px; background: rgba(255, 255, 255, 0.55); overflow: hidden; }
#p-fill { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sun), var(--sun-deep)); transition: width 0.5s ease-out; }
#p-cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
#puzzle .rbtn { position: absolute; z-index: 5; }
#p-tray, #p-swap, #p-eye { transition: opacity 0.6s; }
#puzzle.finished #p-tray, #puzzle.finished #p-swap, #puzzle.finished #p-eye { opacity: 0; pointer-events: none; }
#p-swap svg { transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1); }
#p-fin { position: absolute; inset: 0; z-index: 20; cursor: pointer; }
#p-fin .fin-img { position: absolute; border-radius: 14px; background-size: 100% 100%; box-shadow: 0 8px 24px rgba(33, 86, 124, 0.25); opacity: 0; transition: opacity 1s ease-in-out; }
#p-fin .fin-img.show { opacity: 1; }
#p-fin canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#p-fin .fin-star { position: absolute; display: grid; place-items: center; transform: scale(0); filter: drop-shadow(0 10px 14px rgba(20, 60, 90, 0.4)); pointer-events: none; }
#p-fin .fin-star.show { animation: starIn 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards, wiggle 1.4s ease-in-out 1s infinite alternate; }
#p-fin .fin-star svg { width: 100%; height: 100%; fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1; stroke-linejoin: round; }
@keyframes starIn { 0% { transform: scale(0) rotate(-40deg); } 45% { transform: scale(1.3) rotate(8deg); } 65% { transform: scale(0.88) rotate(-4deg); } 82% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes wiggle { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.04) rotate(5deg); } }

@media (prefers-reduced-motion: reduce) {
  .screen, .card, .card .del { animation: none; }
  #p-fill, #p-ghost, #p-swap svg { transition: none; }
}
</style>

<div id="app">
  <div id="stage">

    <section id="shelf" class="screen" hidden>
      <div class="scroll"><div id="grid"></div></div>
      <button id="lock" class="rbtn" aria-label="Hold to open parent mode">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span class="ring"><svg viewBox="0 0 60 60"><circle id="lock-ring" cx="30" cy="30" r="27"/></svg></span>
      </button>
      <button id="parent-ok" class="rbtn go" aria-label="Done" hidden>
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </section>

    <section id="newp" class="screen" hidden>
      <button id="np-close" class="rbtn" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button id="np-ok" class="rbtn go" aria-label="Create" disabled><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div id="np-frame" class="np-frame">
        <canvas id="np-cv"></canvas>
        <label id="np-pick" class="np-pick" for="np-file" aria-label="Pick a photo">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
        </label>
        <label id="np-swap" class="rbtn np-swap" for="np-file" aria-label="Pick another photo" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
        </label>
      </div>
      <input id="np-file" class="np-file" type="file" accept="image/*">
      <div id="np-sizes" class="sizes"></div>
    </section>

    <section id="puzzle" class="screen" hidden>
      <div id="p-board"><img id="p-ghost" alt=""></div>
      <div id="p-tray"></div>
      <div id="p-bar"><i id="p-fill"></i></div>
      <canvas id="p-cv"></canvas>
      <button id="p-home" class="rbtn" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
      <button id="p-eye" class="rbtn" aria-label="Show or hide the picture"><svg id="p-eye-svg" viewBox="0 0 24 24"></svg></button>
      <button id="p-swap" class="rbtn" aria-label="Deal new pieces"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <div id="p-fin" hidden></div>
    </section>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * Basics
   * ===================================================================== */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var IMG_W = 1800, IMG_H = 1200;
  var SIZES = [
    { n: 24, rows: 4, cols: 6, tryout: true },
    { n: 104, rows: 8, cols: 13 },
    { n: 150, rows: 10, cols: 15 },
    { n: 187, rows: 11, cols: 17 }
  ];
  var app = $('#app'), stage = $('#stage');
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  function cssVar(name, fallback) {
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }
    catch (e) { return fallback; }
  }
  var COLORS = {
    sun: cssVar('--sun', '#ffc933'),

    ink: cssVar('--ink', '#27506f')
  };

  function mulberry32(a) {

  /* =====================================================================

  var ICON_EYE = '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  var ICON_EYE_OFF = ICON_EYE + '<path d="M4 4l16 16"/>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_CLOSE = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';

  /* =====================================================================
   * Storage (IndexedDB, every access guarded; the app works without it)
   * ===================================================================== */

    db: null,
    images: {},
    open: function () {
      var self = this;
      return withTimeout(new Promise(function (res, rej) {

    loadAll: function () { return this.op('puzzles', 'readonly', function (s) { return s.getAll(); }).then(function (r) { return Array.isArray(r) ? r : []; }); },
    putMeta: function (rec) {

        done: !!rec.done, sample: !!rec.sample, created: rec.created, thumb: rec.thumb

    },
    putImage: function (id, data) { this.images[id] = data; return this.op('images', 'readwrite', function (s) { return s.put({ id: id, data: data }); }); },
    getImage: function (id) {
      var self = this;
      if (this.images[id]) return Promise.resolve(this.images[id]);
      return this.op('images', 'readonly', function (s) { return s.get(id); }).then(function (r) {
        if (r && r.data) { self.images[id] = r.data; return r.data; }

    remove: function (id) {

      var a = this.op('puzzles', 'readwrite', function (s) { return s.delete(id); });

  var puzzles = [];

   * ===================================================================== */

  // Parent gate: hold the lock for 2 seconds while the ring fills.

      ring.setAttribute('stroke-dashoffset', C.toFixed(2));
    }
    function tick() {
      var t = (performance.now() - start) / 2000;

      ring.setAttribute('stroke-dashoffset', (C * (1 - Math.min(t, 1))).toFixed(2));

        parentMode = true;
        renderShelf();
        return;

      raf = requestAnimationFrame(tick);

    if (P.rets.length) P.animating = true;

    // pop (just snapped)
    P.pops = P.pops.filter(function (p) {
      var t = (now - p.start) / 280;
      if (t >= 1) return false;
      var tc = targetCenter(p.piece);
      drawPiece(ctx, p.piece, tc.x, tc.y, P.bs * (1 + 0.14 * Math.sin(Math.PI * t)), 1, { blur: 10 * Math.sin(Math.PI * t), dy: 4 * Math.sin(Math.PI * t) });
      return true;
    });
    if (P.pops.length) P.animating = true;

    // dragged piece
    if (P.drag && P.drag.moved) {
      var ds = dragState(P.drag);
      drawPiece(ctx, P.drag.piece, ds.x, ds.y, ds.scale * (1 + 0.06 * (1 - ds.t)), 1, { blur: 16, dy: 9 });
      P.animating = true;
    }
  }

  /* ---------- interaction ---------- */
  function localPoint(e) {
    var r = pCv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function hitSlot(x, y) {
    var L = P.L;
    if (y < L.tray.y || y > L.tray.y + L.tray.h) return -1;
    var s = Math.floor((x - L.slotStartX) / L.slotW);
    if (s < 0 || s >= P.slots.length) return -1;
    return P.slots[s] == null ? -1 : s;
  }

  pCv.addEventListener('pointerdown', function (e) {
    if (!P || P.finished || P.drag || !P.L) return;
    var p = localPoint(e), s = hitSlot(p.x, p.y);
    if (s < 0) return;
    var piece = P.slots[s], now = performance.now();
    // grabbing a piece that is still gliding home: take it from where it is
    P.rets = P.rets.filter(function (r) { return r.piece !== piece; });
    var sc = slotCenter(s);
    P.drag = { id: e.pointerId, piece: piece, slot: s, sx: p.x, sy: p.y, x: p.x, y: p.y, gx: p.x - sc.x, gy: p.y - sc.y, moved: false };
    try { pCv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    e.preventDefault();
    invalidate();
  });
  pCv.addEventListener('pointermove', function (e) {
    var d = P && P.drag;
    if (!d || d.id !== e.pointerId) return;
    var p = localPoint(e);
    d.x = p.x; d.y = p.y;
    if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true;
    invalidate();
  });
  function endDrag(e, cancelled) {
    var d = P && P.drag;
    if (!d || d.id !== e.pointerId) return;
    P.drag = null;
    var now = performance.now();
    if (!d.moved) {
      if (!cancelled) { P.glow = { piece: d.piece, start: now }; }
      invalidate();
      return;
    }
    var ds = dragState(d), tc = targetCenter(d.piece);
    var tol = 0.5 * Math.min(P.cellW, P.cellH) * P.bs;
    if (!cancelled && Math.hypot(ds.x - tc.x, ds.y - tc.y) < tol) {
      placePiece(d.piece);
    } else {
      P.rets.push({ piece: d.piece, slot: d.slot, x: ds.x, y: ds.y, scale: ds.scale, start: now, dur: 330 });
    }
    invalidate();
  }
  pCv.addEventListener('pointerup', function (e) { endDrag(e, false); });
  pCv.addEventListener('pointercancel', function (e) { endDrag(e, true); });
  pCv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function placePiece(i) {
    var before = P.slots.slice();
    P.placed.add(i);
    P.queue.place(i);
    P.slots = P.queue.visible(P.L.slotCount).slice();
    var now = performance.now();
    for (var s = 0; s < P.slots.length; s++) if (P.slots[s] !== before[s]) P.slotAnim[s] = now + 120;
    stampPiece(P.layer.getContext('2d'), i, P.layer.width / P.W);
    P.pops.push({ piece: i, start: now });
    if (P.glow && P.glow.piece === i) P.glow = null;
    P.rec.placed = Array.from(P.placed);
    updateProgress(true);
    playTock();
    var done = P.placed.size >= P.total;
    if (done) { P.rec.done = true; }
    saveProgress(P.rec);
    if (done) {
      P.finished = true;
      setTimeout(function () { if (P && P.finished && screen === 'puzzle') { showFinale(false); } }, 380);
    }
  }

  $('#p-home').addEventListener('click', goShelf);
  $('#p-eye').addEventListener('click', function () {
    eyeOn = !eyeOn;
    $('#p-ghost').style.opacity = eyeOn ? '' : '0';
    setEyeIcon();
  });
  var swapSpin = 0;
  $('#p-swap').addEventListener('click', function () {
    if (!P || P.finished || (P.drag && P.drag.moved)) return;
    P.queue.swap();
    P.slots = P.queue.visible(P.L.slotCount).slice();
    P.rets = [];
    var now = performance.now();
    for (var s = 0; s < P.slots.length; s++) P.slotAnim[s] = now + s * 35;
    swapSpin += 180;
    $('#p-swap svg').style.transform = 'rotate(' + swapSpin + 'deg)';
    invalidate();
  });

  /* =====================================================================
   * Finale: full image, confetti, star, chime
   * ===================================================================== */
  var fin = $('#p-fin'), finTimers = [], confettiRaf = 0, finReady = false;

  function stopFinale() {
    finTimers.forEach(clearTimeout); finTimers = [];
    cancelAnimationFrame(confettiRaf); confettiRaf = 0;
    finReady = false;
    screens.puzzle.classList.remove('finished');
    fin.hidden = true;
    fin.textContent = '';
  }
  function layoutFinale() {
    if (fin.hidden || !P || !P.L) return;
    var b = P.L.board, img = fin.querySelector('.fin-img'), star = fin.querySelector('.fin-star');
    if (img) rectStyle(img, b);
    if (star) {
      var sz = Math.min(b.w, b.h) * 0.62;
      rectStyle(star, { x: b.x + b.w / 2 - sz / 2, y: b.y + b.h / 2 - sz / 2, w: sz, h: sz });
    }
    var cv = fin.querySelector('canvas');
    if (cv) { var w = Math.round(stage.clientWidth * dpr), h = Math.round(stage.clientHeight * dpr); if (cv.width !== w) cv.width = w; if (cv.height !== h) cv.height = h; }
  }
  function showFinale(instant) {
    stopFinale();
    screens.puzzle.classList.add('finished');
    fin.hidden = false;
    fin.innerHTML = '<div class="fin-img"></div><canvas></canvas><div class="fin-star"><svg viewBox="0 0 24 24"><path d="' + STAR_PATH + '"/></svg></div>';
    var img = fin.querySelector('.fin-img');
    img.style.backgroundImage = 'url("' + P.data + '")';
    layoutFinale();
    // let the browser paint the starting state first
    finTimers.push(setTimeout(function () { img.classList.add('show'); }, 30));
    finTimers.push(setTimeout(function () { fin.querySelector('.fin-star').classList.add('show'); playChime(); }, 450));
    startConfetti(fin.querySelector('canvas'));
    finTimers.push(setTimeout(function () { finReady = true; }, 900));
    fin.onpointerdown = function () { if (finReady) goShelf(); };
  }

  function startConfetti(cv) {
    var ctx = cv.getContext('2d'), parts = [], W = stage.clientWidth, H = stage.clientHeight;
    var palette = ['#ff5d73', '#ffc933', '#4cc9f0', '#7bd88f', '#b388eb', '#ff9f43', '#ffffff'];
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* ignore */ }
    var t0 = performance.now(), last = t0, SPAWN_MS = 2600, END_MS = 4600;
    function spawn(n) {
      for (var i = 0; i < n; i++) {
        parts.push({
          x: Math.random() * W, y: -20 - Math.random() * 60,
          vx: (Math.random() - 0.5) * 90, vy: 120 + Math.random() * 180,
          w: 8 + Math.random() * 9, h: 5 + Math.random() * 8,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 9,
          sway: 1 + Math.random() * 2.5, ph: Math.random() * 6.28,
          c: palette[Math.floor(Math.random() * palette.length)], round: Math.random() < 0.3
        });
      }
    }
    function step(now) {
      var dt = Math.min((now - last) / 1000, 0.05); last = now;
      var el = now - t0;
      if (el < SPAWN_MS) spawn(Math.round((reduce ? 40 : 110) * dt));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += 60 * dt;
        p.y += p.vy * dt;
        p.x += (p.vx + Math.sin(now / 400 * p.sway + p.ph) * 40) * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 30) { parts.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.2832); ctx.fill(); }
        else { ctx.scale(1, 0.4 + 0.6 * Math.abs(Math.cos(p.rot * 1.3))); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
        ctx.restore();
      }
      if (el < END_MS || parts.length) { if (el < END_MS + 4000) { confettiRaf = requestAnimationFrame(step); return; } }
      ctx.clearRect(0, 0, W, H);
    }
    confettiRaf = requestAnimationFrame(step);
  }

  /* =====================================================================
   * Resize handling
   * ===================================================================== */
  var resizeRaf = 0;
  function onResize() {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function () {
      var w = stage.clientWidth, h = stage.clientHeight;
      app.classList.toggle('small', Math.min(w, h) < 500);
      if (screen === 'puzzle') relayout(false);
      if (screen === 'newp') layoutNew();
    });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  try { new ResizeObserver(onResize).observe(stage); } catch (e) { /* window resize is enough */ }
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* =====================================================================
   * Debug hooks (used by the automated tests)
   * ===================================================================== */
  window.__puzzleDebug = {
    screen: function () { return screen; },
    state: function () {
      if (!P) return { screen: screen, puzzles: puzzles.length };
      return { screen: screen, placed: P.placed.size, total: P.total, rows: P.rows, cols: P.cols, finished: P.finished, done: !!P.rec.done, slotCount: P.L && P.L.slotCount, pc: P.L && P.L.pc, cell: P.L && P.L.cell, small: P.L && P.L.small };
    },
    targetFor: function (i) {
      var r = pCv.getBoundingClientRect(), t = targetCenter(i);
      return { x: r.left + t.x, y: r.top + t.y, tol: 0.5 * Math.min(P.cellW, P.cellH) * P.bs, cell: P.cellW * P.bs };
    },
    pileSlots: function () {
      var r = pCv.getBoundingClientRect();
      return P.slots.map(function (piece, s) { var c = slotCenter(s); return { slot: s, piece: piece, x: r.left + c.x, y: r.top + c.y }; }).filter(function (o) { return o.piece != null; });
    },
    layout: function () { return P && P.L; },
    puzzles: function () { return puzzles.map(function (p) { return { id: p.id, rows: p.rows, cols: p.cols, placed: p.placed.length, done: p.done, sample: p.sample }; }); }
  };

  /* =====================================================================
   * Boot
   * ===================================================================== */
  function boot() {
    onResize();
    var ready;
    try { ready = window.indexedDB ? store.open() : Promise.resolve(); } catch (e) { ready = Promise.resolve(); }
    ready.then(function () { return store.loadAll(); }).then(function (list) {
      list.sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
      puzzles = list.filter(function (r) { return r && r.id && r.rows && r.cols && Array.isArray(r.placed); });
      if (!puzzles.length) {
        var small = Math.min(stage.clientWidth, stage.clientHeight) < 500;
        return addPuzzle(renderSampleCanvas(), small ? SIZES[0] : SIZES[2], true);
      }
    }).catch(function () { /* the shelf still opens */ }).then(function () {
      showScreen('shelf');
      renderShelf();
    });
  }
  boot();
})();
</script>
